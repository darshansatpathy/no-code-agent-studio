# Two or more replicas on PostgreSQL. Create the secret first:
#   kubectl -n agent-studio create secret generic agent-studio \
#     --from-literal=database-url=postgresql://user:pass@host:5432/studio \
#     --from-literal=service-token=$(openssl rand -hex 32)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-studio
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
  - pdb.yaml
images:
  - name: agent-studio
    newName: ghcr.io/darshansatpathy/no-code-agent-studio
    newTag: 0.1.0
patches:
  - target: {kind: Deployment, name: agent-studio}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: STUDIO_STORE, value: postgres}
          - name: STUDIO_DATABASE_URL
            valueFrom: {secretKeyRef: {name: agent-studio, key: database-url}}
          - name: STUDIO_SERVICE_TOKEN
            valueFrom: {secretKeyRef: {name: agent-studio, key: service-token}}
          - {name: STUDIO_LOG_LEVEL, value: INFO}
